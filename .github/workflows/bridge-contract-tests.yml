name: Bridge contract and simulator tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bridge/**"
      - "tests/**"
      - "agent-factory/**"
      - "index.html"
      - "README.txt"
      - ".github/workflows/bridge-contract-tests.yml"
  push:
    branches:
      - "feature/v1.2-live-command-station"
      - "feature/v2.3-owner-operations-lifecycle"
      - "feature/v3.0-phone-command-and-host-bridge"
      - "release/v3.0-final"
      - "release/v3.0-on-main"
      - "feature/prompt-to-agent-intelligence"
      - "feature/v3.1-tool-registry-dependency-planner"
      - "feature/v3.2-independent-validation-engine"
    paths:
      - "bridge/**"
      - "tests/**"
      - "agent-factory/**"
      - "index.html"
      - ".github/workflows/bridge-contract-tests.yml"

permissions:
  contents: read

jobs:
  bridge-tests:
    name: Node bridge contract and simulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check phone Agent Factory UI
        run: node --check agent-factory/browser-ui.js
      - name: Syntax-check Master Pass UI
        run: node --check master-pass.js
      - name: Syntax-check V2.3 Owner operations UI
        run: node --check v2.3-owner-operations.js
      - name: Syntax-check V3.0 phone command UI
        run: node --check v3.0-phone-command.js
      - name: Syntax-check prompt-to-agent planner
        run: node --check prompt-to-agent.js
      - name: Syntax-check tool registry planner
        run: node --check tool-registry.js
      - name: Syntax-check V3.2 independent validation engine
        run: node --check independent-validation.js
      - name: Validate V3.0 protocol schema JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('bridge/protocol-v3.schema.json','utf8'))"
      - name: Run all bridge and factory tests
        run: node --test tests/*.test.cjs
